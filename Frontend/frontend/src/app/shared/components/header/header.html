<header class="header">
  <div class="header-brand">
  <img src="logo.jpg" alt="STRETTO" class="brand-logo" width="44" height="44" />
  <div class="brand-text">
    <span class="brand-name">STRETTO</span>
  </div>
</div>

  @if (usuario(); as u) {
    <div class="header-user-section">
      <div class="user-chip">
        <div class="user-avatar" [class.avatar-admin]="u.rol === 'ROLE_ADMIN'">
          {{ u.username.charAt(0).toUpperCase() }}
        </div>
        <div class="user-details">
          <span class="user-username">{{ u.username }}</span>
          <span class="user-role-badge" [class.role-admin]="u.rol === 'ROLE_ADMIN'">
            {{ u.rol === 'ROLE_ADMIN' ? 'Administrador' : (u.rol === 'ROLE_WHOLESALE' ? 'Mayorista' : 'Empleado') }}
          </span>
        </div>
      </div>

      <button type="button" class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión actual">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  }
</header>
