<aside class="sidebar">
  <div class="sidebar-section-title">NAVEGACIÓN</div>

  <nav class="sidebar-nav">
    <ul class="sidebar-menu">
      @for (item of menu(); track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="active"
            class="sidebar-link"
          >
            @if (item.icono === 'empleados') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="link-icon"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            } @else if (item.icono === 'sabores') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="link-icon"
              >
                <path d="m7 11 4.08 10.35a1 1 0 0 0 1.84 0L17 11"></path>
                <path d="M17 7A5 5 0 0 0 7 7"></path>
                <path d="M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"></path>
              </svg>
            } @else if (item.icono === 'insumos') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="link-icon"
              >
                <circle cx="12" cy="19" r="2"></circle>
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="16" cy="12" r="2"></circle>
                <circle cx="20" cy="19" r="2"></circle>
                <circle cx="4" cy="19" r="2"></circle>
                <circle cx="8" cy="12" r="2"></circle>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="link-icon"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            }

            <span class="link-text">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
