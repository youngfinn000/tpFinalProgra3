<aside class="sidebar">
  <div class="sidebar-section-title">NAVEGACIÓN</div>
  <nav class="sidebar-nav">
    <ul class="sidebar-menu">
      @for (item of menu(); track item.ruta) {
        <li>
          <a [routerLink]="item.ruta" routerLinkActive="active" class="sidebar-link">
            @if (item.icono === 'empleados') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="link-icon"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            } @else if (item.icono === 'productos') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="link-icon"
              >
                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                <path d="m3.3 7 8.7 5 8.7-5"></path>
                <path d="M12 22V12"></path>
              </svg>
            } @else if (item.icono === 'sabores') {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="link-icon"
              >
                <path d="m7 11 4.08 10.35a1 1 0 0 0 1.84 0L17 11"></path>
                <path d="M17 7A5 5 0 0 0 7 7"></path>
                <path d="M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"></path>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="link-icon"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            }
            <span class="link-text">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
