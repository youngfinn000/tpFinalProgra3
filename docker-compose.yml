services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: strettogelato
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend/demo
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./Backend/demo/.env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/strettogelato?allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  frontend:
    build: ./Frontend/frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
